<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
  <meta name="description" content="今天我要吃什么——为午饭和晚饭随机挑选美食" />
  <title>今天我要吃什么？</title>
  <style>
    :root { --ink:#315443; --muted:#71917e; --deep:#4c8c68; --leaf:#75b986; --mint:#e4f4e7; --cream:#fffdf4; --peach:#ffe3bf; --pink:#ffd8d0; --line:#cde3d2; --shadow:0 15px 35px rgba(57,113,76,.12); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; overflow-x:hidden; -webkit-text-size-adjust:100%; color:var(--ink); font-family:KaiTi, STKaiti, "楷体", serif; background:radial-gradient(circle at 9% 7%,#fff8d9 0 5%,transparent 23%),radial-gradient(circle at 88% 15%,#d7f1df 0 8%,transparent 28%),var(--cream); }
    button,input,select { font:inherit; }
    .wrap { width:min(940px, calc(100% - 32px)); margin:auto; padding:44px 0 54px; }
    header { text-align:center; margin-bottom:28px; }
    .kicker { display:inline-block; padding:6px 14px; background:#fff0b7; border-radius:99px; color:#846826; font-size:.92rem; }
    h1 { margin:12px 0 5px; font-size:clamp(2.25rem,6vw,4rem); letter-spacing:.07em; color:#356748; }
    header p { margin:0; color:var(--muted); font-size:1.08rem; }
    .panel { background:rgba(255,255,255,.78); border:1px solid rgba(205,227,210,.8); border-radius:26px; padding:25px; box-shadow:var(--shadow); backdrop-filter:blur(4px); }
    .choices { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
    .field-title { display:flex; align-items:center; gap:8px; margin:0 0 10px; font-size:1.15rem; font-weight:bold; }
    .field-title span { font-size:1.25rem; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { border:1px solid var(--line); padding:7px 12px; border-radius:99px; color:var(--ink); background:#fff; cursor:pointer; transition:.18s; }
    .chip:hover { transform:translateY(-1px); border-color:var(--leaf); }
    .chip.active { color:#fff; background:var(--deep); border-color:var(--deep); box-shadow:0 5px 12px rgba(76,140,104,.2); }
    .main-btn { display:block; border:0; margin:24px auto 0; border-radius:99px; padding:14px 34px; min-width:225px; background:linear-gradient(135deg,#63aa74,#3d8962); color:#fff; box-shadow:0 9px 20px rgba(60,130,91,.28); font-size:1.28rem; cursor:pointer; transition:.2s; }
    .main-btn:hover { transform:translateY(-2px) scale(1.02); }
    .main-btn:active { transform:translateY(1px); }
    .results { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:22px; }
    .results.with-drink { grid-template-columns:1fr 1fr; }
    .result { text-align:center; min-height:204px; display:flex; flex-direction:column; justify-content:center; position:relative; overflow:hidden; }
    #drinkResult { display:flex; }
    #drinkResult.show { display:flex; }
    .result::after { content:"✦  ·  ✦"; position:absolute; color:#add7b5; font-size:1.4rem; bottom:18px; left:50%; transform:translateX(-50%); letter-spacing:16px; }
    .result .empty { color:var(--muted); font-size:1.12rem; }
    .food-icon { font-size:2.5rem; line-height:1; }
    .food-name { margin:6px 0 4px; color:#286143; font-size:clamp(1.85rem,5vw,2.65rem); font-weight:bold; }
    .food-type { display:inline-block; padding:4px 12px; border-radius:99px; background:#e8f5e9; color:#508363; }
    .food-reason { margin:10px auto 18px; color:var(--muted); font-size:1.06rem; }
    .result.pop .food-icon,.result.pop .food-name { animation:pop .38s ease-out both; }
    @keyframes pop { 0%{opacity:0;transform:scale(.6) rotate(-6deg)} 72%{transform:scale(1.1) rotate(2deg)} 100%{opacity:1;transform:scale(1)} }
    .notice { min-height:22px; margin:10px 0 0; text-align:center; color:#b46755; }
    .extras { display:flex; justify-content:center; gap:12px; margin-top:17px; }
    .text-btn { border:0; background:transparent; color:var(--deep); text-decoration:underline; cursor:pointer; font-size:1rem; }
    dialog { width:min(570px,calc(100% - 28px)); border:1px solid var(--line); border-radius:22px; padding:0; color:var(--ink); box-shadow:0 20px 60px rgba(28,67,43,.25); }
    dialog::backdrop { background:rgba(39,75,52,.28); backdrop-filter:blur(3px); }
    .dialog-inner { padding:25px; background:var(--cream); }
    .dialog-inner h2 { margin:0 0 4px; font-size:1.55rem; }
    .dialog-inner p { margin:0 0 17px; color:var(--muted); }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
    label { display:block; color:var(--muted); }
    input,select { width:100%; margin-top:5px; border:1px solid var(--line); border-radius:10px; padding:9px 10px; color:var(--ink); background:#fff; }
    .dialog-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:19px; }
    .secondary { border:1px solid var(--line); padding:8px 15px; border-radius:10px; color:var(--ink); background:#fff; cursor:pointer; }
    .save { border:0; padding:8px 15px; border-radius:10px; color:#fff; background:var(--deep); cursor:pointer; }
    .personal-list { max-height:180px; overflow:auto; margin-top:16px; }
    .personal-item { display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-top:1px dashed var(--line); }
    .personal-item button { border:0; background:transparent; color:#b46755; cursor:pointer; }
    footer { text-align:center; color:var(--muted); margin-top:23px; font-size:.96rem; }

    /* === 抽签动画 === */
    .result.rolling .food-icon { animation:roll .12s linear infinite; }
    .result.rolling .food-name { opacity:.5; }
    @keyframes roll { 0%{transform:translateY(-4px) rotate(-3deg)} 50%{transform:translateY(4px) rotate(3deg)} 100%{transform:translateY(-4px) rotate(-3deg)} }
    .result-actions { display:flex; gap:10px; justify-content:center; margin-top:14px; position:relative; z-index:2; flex-wrap:wrap; }
    .mini-btn { border:1px solid var(--line); background:#fff; color:var(--deep); border-radius:99px; padding:5px 14px; font-size:.92rem; cursor:pointer; transition:.15s; font-family:inherit; }
    .mini-btn:hover { background:var(--mint); border-color:var(--leaf); }
    .mini-btn.primary { background:var(--deep); color:#fff; border-color:var(--deep); }
    .mini-btn.primary:hover { background:var(--leaf); }
    .history-list { max-height:340px; overflow:auto; }
    .history-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px dashed var(--line); }
    .history-item .hi-icon { font-size:1.5rem; }
    .history-item .hi-main { flex:1; }
    .history-item .hi-name { font-weight:bold; color:#286143; }
    .history-item .hi-meta { font-size:.88rem; color:var(--muted); }
    .history-item .hi-time { font-size:.82rem; color:var(--muted); white-space:nowrap; }
    

    /* === 饮品偏好栏 === */
    .drink-avoids { display:flex; align-items:center; gap:8px; justify-content:center; flex-wrap:wrap; margin:0 0 18px; }
    .drink-avoids .da-label { color:var(--muted); font-size:.98rem; }
    .drink-avoids .chip { padding:5px 11px; font-size:.9rem; }
    .drink-avoids .chip.active { background:linear-gradient(135deg,#e89aa4,#c97883); border-color:#c97883; box-shadow:0 5px 12px rgba(201,120,131,.2); }
    /* === 抽签按钮行 === */
    .draw-btns { display:flex; gap:16px; justify-content:center; align-items:flex-start; flex-wrap:wrap; margin:22px auto 0; }
    .draw-btns .main-btn { margin:0; }
    .draw-drink-wrap { display:flex; flex-direction:column; align-items:center; gap:0; }
    /* drink-main-btn 用粉绿配色 */
    .drink-main-btn { background:linear-gradient(135deg,#7ec8a8,#4a8c68); box-shadow:0 9px 20px rgba(74,140,104,.25); }
    .drink-main-btn:hover { background:linear-gradient(135deg,#98d9bb,#5ea07a); }
    
    .with-drink-row { text-align:center; margin-top:14px; }
    .with-drink-row label { color:var(--muted); font-size:1rem; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
    .with-drink-row input { width:auto; margin:0; accent-color:var(--deep); }
    /* ====== 响应式适配 ====== */
    @media (max-width:640px) {
      html { font-size:15px; -webkit-tap-highlight-color:transparent; }
      body { background-attachment:fixed; }
      .wrap { width:100%; padding:18px 14px 36px; box-sizing:border-box; }
      header { margin-bottom:20px; }
      header p { font-size:.98rem; padding:0 6px; }
      h1 { font-size:2.1rem !important; letter-spacing:.04em; margin:10px 0 6px; }
      .kicker { font-size:.82rem; padding:5px 12px; }
      .panel { padding:16px 14px; border-radius:20px; }
      .choices { grid-template-columns:1fr; gap:14px; }
      .field-title { font-size:1.05rem; margin-bottom:8px; }
      .chips { gap:7px; }
      .chip { padding:8px 13px; font-size:.95rem; min-height:36px; display:inline-flex; align-items:center; }
      .main-btn { padding:14px 28px; font-size:1.18rem; min-width:0; width:100%; max-width:320px; min-height:52px; touch-action:manipulation; }
      .drink-main-btn { width:100%; max-width:320px; }
      .draw-btns { flex-direction:column; gap:12px; align-items:center; margin-top:18px; }
      .draw-btns .main-btn { width:100%; max-width:320px; }
      .draw-drink-wrap { width:100%; display:flex; flex-direction:column; align-items:center; gap:0; }
      .with-drink-row { margin-top:12px; }
      .with-drink-row label { font-size:.95rem; }
      .drink-avoids { gap:7px; margin-bottom:14px; }
      .drink-avoids .chip { padding:7px 12px; min-height:36px; }
      .da-label { font-size:.92rem; width:100%; text-align:center; margin-bottom:2px; }
      .results { grid-template-columns:1fr; gap:12px; margin-top:16px; }
      .result { min-height:180px; padding:20px 14px; }
      .result::after { font-size:1.2rem; letter-spacing:12px; bottom:12px; }
      .food-icon { font-size:2.2rem; }
      .food-name { font-size:1.75rem !important; }
      .food-type { font-size:.88rem; padding:3px 10px; }
      .food-reason { font-size:.98rem; padding:0 8px; }
      .result-actions { gap:8px; margin-top:10px; }
      .mini-btn { padding:7px 14px; font-size:.88rem; min-height:34px; }
      .form-grid { grid-template-columns:1fr; gap:10px; }
      input,select { padding:10px; font-size:1rem; min-height:42px; }
      dialog { width:calc(100% - 20px); border-radius:18px; }
      .dialog-inner { padding:18px; }
      .dialog-actions { flex-direction:row; gap:8px; }
      .extras { gap:14px; flex-wrap:wrap; margin-top:14px; }
      .text-btn { font-size:.95rem; padding:8px 4px; min-height:36px; }
      .notice { font-size:.92rem; min-height:20px; }
      footer { font-size:.88rem; margin-top:18px; padding:0 10px; }
      .history-item { padding:8px 0; }
      .hi-name { font-size:.98rem; }
      .hi-meta { font-size:.82rem; }
      .hi-time { font-size:.78rem; }
    }
    @media (max-width:380px) {
      html { font-size:14px; }
      h1 { font-size:1.85rem !important; }
      .main-btn { padding:13px 20px; font-size:1.1rem; min-height:48px; }
      .chip { padding:7px 11px; font-size:.9rem; }
      .wrap { padding:14px 10px 28px; }
      .panel { padding:14px 11px; border-radius:16px; }
      .result { min-height:160px; padding:16px 10px; }
      .food-icon { font-size:2rem; }
      .food-name { font-size:1.55rem !important; }
    }
    /* 触摸优化：所有可点击元素最小触控尺寸 */
    @media (pointer:coarse) {
      button, .chip, .text-btn, .mini-btn, input[type="checkbox"] { min-height:36px; min-width:36px; }
      input[type="checkbox"] { width:20px; height:20px; transform:scale(1.2); margin-right:4px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="kicker">吃什么，听天由命吧！</div>
      <h1>今天我要吃什么？</h1>
      <p>可以先选偏好与忌口，也可以完全随机...</p>
    </header>
    <section class="panel" aria-label="用餐偏好">
      <div class="choices">
        <div>
          <p class="field-title"><span>💚</span>今天更想吃</p>
          <div class="chips" id="likes">
            <button class="chip" data-tag="米饭">米饭</button><button class="chip" data-tag="面食">面食</button><button class="chip" data-tag="粉">粉</button><button class="chip" data-tag="麻辣">麻辣/香锅</button><button class="chip" data-tag="轻食">轻食/沙拉</button><button class="chip" data-tag="西式">西式/快餐</button><button class="chip" data-tag="其他">火锅/烧烤</button>
            <button class="chip" data-tag="鸡肉">鸡肉</button><button class="chip" data-tag="牛肉">牛肉</button><button class="chip" data-tag="猪肉">猪肉</button><button class="chip" data-tag="海鲜">鱼/海鲜</button><button class="chip" data-tag="鸡蛋">鸡蛋</button><button class="chip" data-tag="菌菇">菌菇</button><button class="chip" data-tag="番茄">番茄</button><button class="chip" data-tag="豆腐">豆腐</button><button class="chip" data-tag="素食">素食</button>
          </div>
        </div>
        <div>
          <p class="field-title"><span>🌿</span>今天不想碰</p>
          <div class="chips" id="avoids">
            <button class="chip" data-tag="辣">辣</button><button class="chip" data-tag="香菜">香菜</button><button class="chip" data-tag="葱">葱</button><button class="chip" data-tag="姜">姜</button><button class="chip" data-tag="蒜">蒜</button><button class="chip" data-tag="酸">酸</button>
            <button class="chip" data-tag="牛肉">牛肉</button><button class="chip" data-tag="羊肉">羊肉</button><button class="chip" data-tag="海鲜">海鲜</button><button class="chip" data-tag="内脏">内脏</button><button class="chip" data-tag="猪肉">猪肉</button><button class="chip" data-tag="花生">花生</button><button class="chip" data-tag="乳制品">乳制品</button><button class="chip" data-tag="鸡蛋">鸡蛋</button>
            <button class="chip" data-tag="只吃素">全素</button>
          </div>
        </div>
      </div>
      <div class="drink-avoids" id="drinkAvoids">
        <span class="da-label">🥤 饮品偏好：</span>
        <button class="chip" data-dtag="咖啡因">不含咖啡因</button>
        <button class="chip" data-dtag="茶底">不要茶底</button>
      </div>
      <div class="draw-btns">
        <button type="button" class="main-btn" id="draw">看看吃啥 🍚</button>
        <div class="draw-drink-wrap">
          <button type="button" class="main-btn drink-main-btn" id="drawDrink">抽杯饮品 🥤</button>
        </div>
      </div>
      <div class="with-drink-row"><label><input type="checkbox" id="withDrink" /> 同时抽饮品</label></div>
      <p class="notice" id="notice" role="alert"></p>
    </section>
    <section class="results" id="results" aria-live="polite">
      <div class="panel result" id="result">
        <div class="empty">🎲 点击上方绿色按钮，抽取你的天命食物</div>
      </div>
      <div class="panel result" id="drinkResult">
        <div class="empty">🥤 勾选"同时抽取饮品"，或点粉色按钮单独抽</div>
      </div>
    </section>
    <div class="extras"><button class="text-btn" id="manage">＋ 管理我的菜单</button><button class="text-btn" id="historyBtn">🕐 最近记录</button><button class="text-btn" id="reset">清空本次选择</button></div>
    <footer>内置 550+ 道餐食 · 300+ 款主流奶茶咖啡 · 自定义菜单保存在本机</footer>
  </main>
  <dialog id="menuDialog">
    <form method="dialog" class="dialog-inner" id="dishForm">
      <h2>我的菜单</h2><p>加上你常去店里的招牌菜，下一次就可能抽到它。</p>
      <div class="form-grid">
        <label>食物名称<input required id="dishName" placeholder="例如：阿姨家的土豆牛腩饭" /></label>
        <label>类别<select id="dishType"><option>米饭</option><option>面食</option><option>粉</option><option>麻辣</option><option>轻食</option><option>西式</option><option>其他</option></select></label>
        <label>包含标签<input id="dishTags" placeholder="用逗号隔开，如 牛肉,辣" /></label>
        <label>推荐理由<input id="dishReason" placeholder="例如：香香的，分量足" /></label>
      </div>
      <div class="dialog-actions"><button class="secondary" type="button" id="closeDialog">关闭</button><button class="save" type="submit">加入菜单</button></div>
      <div class="personal-list" id="personalList"></div>
    </form>
  </dialog>
  <dialog id="historyDialog">
    <div class="dialog-inner">
      <h2>最近吃了啥</h2>
      <p>最近 10 次抽签结果，帮你回忆一下。</p>
      <div class="history-list" id="historyList"><p style="color:var(--muted)">还没有记录。</p></div>
      <div class="dialog-actions"><button class="secondary" type="button" id="closeHistory">关闭</button><button class="secondary" type="button" id="clearHistory" style="color:#b46755">清空记录</button></div>

(function(){
  const dairyTypes = ['奶茶','奶昔','酸奶','芝士茶','仙草','冰沙','冰淇淋','热饮'];
  drinks.forEach(d => {
    // 根据类型加乳制品标签
    if (dairyTypes.includes(d.type) && !d.tags.includes('乳制品')) d.tags.push('乳制品');
    // 咖啡类：含"拿铁/卡布/摩卡/玛奇朵/澳白/馥芮/星冰乐/生椰/丝绒/厚乳"的有乳制品
    if (d.type === '咖啡') {
      const milkKW = ['拿铁','卡布','摩卡','玛奇朵','澳白','馥芮','星冰乐','生椰','丝绒','厚乳','奶','瑞纳冰'];
      if (milkKW.some(k=>d.name.includes(k)) && !d.tags.includes('乳制品')) d.tags.push('乳制品');
    }
    // 果茶：名字含"芝士/酪酪/奶盖/奶昔/酸奶/椰奶/奶冻/生椰/牛乳/奶"的有乳制品
    if (d.type === '果茶') {
      const milkKW = ['芝士','酪酪','奶盖','酸奶','椰奶','奶冻','生椰','牛乳','牛奶','奶昔','奶芙'];
      if (milkKW.some(k=>d.name.includes(k)) && !d.tags.includes('乳制品')) d.tags.push('乳制品');
    }
    // 咖啡类型标签
    if (d.type === '咖啡' && !d.tags.includes('咖啡')) d.tags.push('咖啡');
  });
})();

$$('.chip').forEach(b => b.addEventListener('click', () => b.classList.toggle('active')));
    const selectedDrink = () => $$('#drinkAvoids .chip.active').map(b => b.dataset.dtag);

const selected = id => $$('#' + id + ' .chip.active').map(b => b.dataset.tag);

// === 结果渲染（保留操作按钮） ===
function showResult(target, item, label) {
  const r = $(target);
  r.classList.remove('pop', 'rolling');
  void r.offsetWidth;
  r.classList.add('pop');
  const isDrink = target === '#drinkResult';
  r.innerHTML =
    '<div class="food-icon">' + (item.icon || '🍽️') + '</div>' +
    '<div class="food-name">' + item.name + '</div>' +
    '<span class="food-type">' + label + ' · ' + item.type + '</span>' +
    '<p class="food-reason">' + (item.reason || '这是你自定义的心头好。') + '</p>' +
    '<div class="result-actions">' +
      '<button class="mini-btn" onclick="reroll(' + (isDrink ? "'drink'" : "'food'") + ')">🎲 换一个</button>' +
      '<button class="mini-btn primary" onclick="accept(' + (isDrink ? "'drink'" : "'food'") + ')">👍 就它了</button>' +
    '</div>';
}

function showEmpty(target, text) {
  const r = $(target);
  r.classList.remove('pop', 'rolling');
  r.innerHTML = '<div class="empty">' + text + '</div>';
}

function showRolling(target) {
  const r = $(target);
  r.classList.remove('pop');
  r.classList.add('rolling');
  r.innerHTML = '<div class="food-icon">🎲</div><div class="food-name">…</div><span class="food-type">抽取中…</span>';
}

// === 抽签核心 ===
function getFoodCandidates() {
  const likes = selected('likes');
  const avoids = selected('avoids');
  const all = [...baseFoods, ...custom];
  let candidates = all.filter(f => !avoids.some(tag => f.tags.includes(tag)));
  if (avoids.includes('只吃素')) candidates = candidates.filter(f => f.tags.includes('素食'));
  if (likes.length) {
    const matching = candidates.filter(f => likes.some(tag => f.type === tag || f.tags.includes(tag)));
    if (matching.length) candidates = matching;
  }
  return candidates;
}

function getDrinkCandidates() {
  const avoids = selected('avoids');
  const dAvds = selectedDrink();
  return drinks.filter(d => {
    if (avoids.some(tag => d.tags.includes(tag))) return false;
    if (dAvds.includes('咖啡因') && (d.tags.includes('咖啡') || d.type === '咖啡')) return false;
    if (dAvds.includes('茶底')) {
      const teaTypes = ['奶茶','芝士茶','纯茶','仙草'];
      if (teaTypes.includes(d.type)) return false;
      const teaKW = ['奶茶','奶绿','乌龙','茉莉','绿妍','红茶','绿茶','抹茶','焙茶','龙井','碧螺春','茶马'];
      if (teaKW.some(k=>d.name.includes(k))) return false;
    }
    return true;
  });
}
function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function draw() {
  const candidates = getFoodCandidates();
  if (!candidates.length) {
    $('#notice').textContent = '这些条件组合后没有合适选项，试着少选一项忌口吧。';
    return;
  }
  $('#notice').textContent = '';
  lastFoodCandidates = candidates;

  // 滚动动画
  showRolling('#result');
  let ticks = 0;
  const rollInterval = setInterval(() => {
    const preview = pickRandom(candidates);
    const r = $('#result');
    r.querySelector('.food-icon').textContent = preview.icon || '🍽️';
    r.querySelector('.food-name').textContent = preview.name;
    ticks++;
    if (ticks >= 8) {
      clearInterval(rollInterval);
      const f = pickRandom(candidates);
      showResult('#result', f, '今天');
      addHistory(f, '今日');
      if ($('#withDrink').checked) drawDrink();
    }
  }, 70);
}

function drawDrink() {
  const candidates = getDrinkCandidates();
  if (!candidates.length) {
    $('#notice').textContent = '饮品条件太严格啦，试着少选一项忌口吧。';
    return false;
  }
  $('#notice').textContent = '';
  lastDrinkCandidates = candidates;

  showRolling('#drinkResult');
  let ticks = 0;
  const rollInterval = setInterval(() => {
    const preview = pickRandom(candidates);
    const r = $('#drinkResult');
    r.querySelector('.food-icon').textContent = preview.icon || '🥤';
    r.querySelector('.food-name').textContent = preview.name;
    ticks++;
    if (ticks >= 6) {
      clearInterval(rollInterval);
      const d = pickRandom(candidates);
      showResult('#drinkResult', d, '饮品');
    }
  }, 70);
  return true;
}

// === 换一个 / 就它了 ===
function reroll(type) {
  if (type === 'food') {
    if (!lastFoodCandidates.length) lastFoodCandidates = getFoodCandidates();
    if (!lastFoodCandidates.length) return;
    const f = pickRandom(lastFoodCandidates);
    showResult('#result', f, '今天');
    addHistory(f, '今日');
  } else {
    if (!lastDrinkCandidates.length) lastDrinkCandidates = getDrinkCandidates();
    if (!lastDrinkCandidates.length) return;
    const d = pickRandom(lastDrinkCandidates);
    showResult('#drinkResult', d, '饮品');
  }
}

function accept(type) {
  const r = $(type === 'food' ? '#result' : '#drinkResult');
  r.querySelectorAll('.mini-btn').forEach(b => b.remove());
  const note = document.createElement('div');
  note.style.cssText = 'color:#508363;font-size:.95rem;margin-top:8px;';
  note.textContent = type === 'food' ? '✅ 好，就吃这个！' : '✅ 好，就喝这个！';
  r.appendChild(note);
}

// === 历史记录 ===
function addHistory(item, label) {
  history.unshift({
    name: item.name,
    type: item.type,
    icon: item.icon || '🍽️',
    label: label,
    time: new Date().toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
  });
  if (history.length > 10) history = history.slice(0, 10);
  localStorage.setItem('lunch-lottery-history', JSON.stringify(history));
}

function renderHistory() {
  const list = $('#historyList');
  if (!history.length) {
    list.innerHTML = '<p style="color:var(--muted)">还没有记录。</p>';
    return;
  }
  list.innerHTML = history.map(h =>
    '<div class="history-item">' +
      '<span class="hi-icon">' + h.icon + '</span>' +
      '<div class="hi-main"><div class="hi-name">' + h.name + '</div>' +
      '<div class="hi-meta">' + h.label + ' · ' + h.type + '</div></div>' +
      '<span class="hi-time">' + h.time + '</span>' +
    '</div>'
  ).join('');
}

// === 事件绑定 ===
$('#draw').addEventListener('click', draw);
$('#drawDrink').addEventListener('click', drawDrink);
$('#reset').addEventListener('click', () => {
  $('.chip.active').forEach(b => b.classList.remove('active'));
  $$('.drink-avoids .chip.active').forEach(b => b.classList.remove('active'));
  $('#withDrink').checked = false;
  showEmpty('#result', '🎲 点击上方绿色按钮，抽取你的天命食物');
  showEmpty('#drinkResult', '🥤 勾选"同时抽取饮品"，或点粉色按钮单独抽');
  $('#notice').textContent = '已清空本次选择。';
  lastFoodCandidates = [];
  lastDrinkCandidates = [];
});

// withDrink 取消勾选时重置饮品区
$('#withDrink').addEventListener('change', e => {
  if (!e.target.checked) {
    showEmpty('#drinkResult', '🥤 勾选"同时抽取饮品"，或点粉色按钮单独抽');
  }
});

// 菜单管理 dialog
const dialog = $('#menuDialog');
$('#manage').addEventListener('click', () => { renderCustom(); dialog.showModal(); });
$('#closeDialog').addEventListener('click', () => dialog.close());

function saveCustom() {
  localStorage.setItem('lunch-lottery-custom', JSON.stringify(custom));
  renderCustom();
}

function renderCustom() {
  const list = $('#personalList');
  list.innerHTML = custom.length ? custom.map((f, i) =>
    '<div class="personal-item"><span>' + (f.icon || '🍽️') + ' ' + f.name + ' <small>· ' + f.type + '</small></span>' +
    '<button type="button" data-delete="' + i + '">删除</button></div>'
  ).join('') : '<p>还没有自定义菜品。</p>';
  $$('[data-delete]').forEach(b => b.onclick = () => {
    custom.splice(+b.dataset.delete, 1);
    saveCustom();
  });
}

$('#dishForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('#dishName').value.trim();
  if (!name) return;
  custom.push({
    name: name,
    type: $('#dishType').value,
    tags: $('#dishTags').value.split(/[,，]/).map(x => x.trim()).filter(Boolean),
    reason: $('#dishReason').value.trim(),
    icon: '⭐'
  });
  saveCustom();
  e.target.reset();
});

// 历史记录 dialog
const hDialog = $('#historyDialog');
$('#historyBtn').addEventListener('click', () => { renderHistory(); hDialog.showModal(); });
$('#closeHistory').addEventListener('click', () => hDialog.close());
$('#clearHistory').addEventListener('click', () => {
  history = [];
  localStorage.removeItem('lunch-lottery-history');
  renderHistory();
});
  </script>
</body>
</html>
